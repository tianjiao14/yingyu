<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://img.icons8.com/color/512/peach.png">
<link rel="icon" href="https://img.icons8.com/color/512/peach.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">    
<title>文一墨的纯英演说大冒险 🌸</title>
    <style>
        :root {
            --primary-color: #ff7675;
            --success-color: #2ecc71;
            --accent-color: #f1c40f;
            --boss-color: #9b59b6;
            --hp-color: #e74c3c;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fff0f0 100%);
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 15px;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 { color: #d32f2f; margin-bottom: 5px; font-size: 28px; }
        
        .import-zone {
            background: white; border: 2px dashed var(--primary-color);
            padding: 15px; border-radius: 16px; margin-bottom: 15px; text-align: left;
        }
        .import-zone textarea {
            width: 100%; height: 110px; margin-top: 5px; margin-bottom: 10px;
            border: 1px solid #ddd; border-radius: 8px; padding: 8px; box-sizing: border-box;
            font-size: 14px; line-height: 1.4;
        }
        
        .map-container {
            display: flex; justify-content: center; flex-wrap: wrap; gap: 12px;
            margin: 15px auto; padding: 15px; background: rgba(255, 255, 255, 0.85);
            border-radius: 20px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
        }
        .level-node {
            width: 45px; height: 45px; border-radius: 50%; background: #dfe6e9; color: #b2bec3;
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px;
            border: 3px solid #b2bec3; cursor: pointer; position: relative;
        }
        .level-node.boss-node::after { content: '👹'; position: absolute; top: -12px; right: -12px; font-size: 16px; }
        .level-node.active { background: var(--primary-color); color: white; border-color: #d63031; transform: scale(1.1); }
        .level-node.boss-node.active { background: var(--boss-color); border-color: #8e44ad; }
        .level-node.cleared { background: var(--success-color); color: white; border-color: #27ae60; }

        .boss-battlefield {
            display: none; background: #2c3e50; color: white; padding: 15px; border-radius: 16px; margin-bottom: 15px;
        }
        .hp-bar-bg { width: 100%; background: #7f8c8d; height: 15px; border-radius: 10px; margin-top: 5px; overflow: hidden; }
        .hp-bar-fill { width: 100%; background: var(--hp-color); height: 100%; transition: width 0.5s; }

        .card {
            background: white; border-radius: 24px; padding: 35px 25px;
            box-shadow: 0 10px 30px rgba(211, 47, 47, 0.06); border: 2px solid #ffe0e0; margin-bottom: 15px;
        }
        .word-container { font-size: 26px; font-weight: bold; color: #2c3e50; line-height: 1.6; margin-bottom: 15px; min-height: 80px; text-align: left; }
        
        .boss-sentence-block {
            margin-bottom: 15px; padding: 12px 15px; border-radius: 12px;
            border-left: 5px solid #dfe6e9; text-align: left; background: #fafafa;
        }
        .boss-sentence-block.active-sentence {
            border-left-color: var(--boss-color); background: rgba(155, 89, 182, 0.04);
        }
        .boss-english-row { font-size: 24px; font-weight: bold; color: #2c3e50; line-height: 1.5; }

        .word-span { display: inline-block; margin: 0 4px; transition: color 0.15s, transform 0.15s; }
        .word-span.highlight { color: #f39c12; transform: scale(1.15); text-shadow: 0 0 5px rgba(243,156,18,0.3); }
        .score-box { font-size: 45px; font-weight: bold; margin-top: 10px; color: var(--primary-color); }
        
        .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
        button {
            background-color: var(--primary-color); color: white; border: none; padding: 14px 30px;
            font-size: 18px; font-weight: bold; border-radius: 35px; cursor: pointer; box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }
        button:disabled { background-color: #b2bec3; cursor: not-allowed; }
        #micBtn { background-color: #0984e3; }
        #micBtn.recording { background-color: #e17055; animation: pulse 1s infinite; }
        #passBtn { background-color: var(--success-color); }
        .clear-cache-btn { background-color: #7f8c8d; padding: 6px 14px; font-size: 12px; border-radius: 10px; margin-left: 10px; cursor: pointer; color: white; border: none;}
    </style>
</head>
<body>

    <h1>🌸 文一墨的纯英演说大冒险 🌸</h1>
    
    <div class="import-zone">
        <label style="font-weight: bold; color: #c0392b;">✍️ 第一步：把纯英文演讲稿贴到这里（严格一句一行，系统将完全按这里的换行划分关卡）</label>
        <textarea id="textInput" oninput="saveTextToCache()" placeholder="可以将演讲稿贴在这里，一行一句英文..."></textarea>

        <label style="font-weight: bold; color: var(--primary-color); display: block; margin-top: 10px; margin-bottom: 5px;">🎵 第二步：导入整段长录音 (MP3/WAV)</label>
        <input type="file" id="audioFile" accept="audio/*" onchange="handleAudioUpload(this)">
        <span id="audioStatus" style="font-size: 14px; color: #95a5a6; font-weight: bold; margin-left: 10px;">请先贴入文字，再上传音频。</span>
        
        <div style="margin-top: 10px; font-weight: bold; font-size: 14px; text-align: center;">
            🐢 语速调节：
            <input type="range" id="speedRange" min="0.5" max="1.3" step="0.05" value="1.0" oninput="currentPlaybackRate = parseFloat(this.value); document.getElementById('speedLabel').innerText=this.value+'x'">
            <span id="speedLabel">1.0x</span>
            <button onclick="clearGameCache()" class="clear-cache-btn">🗑️ 清空文本存档</button>
        </div>
    </div>

    <!-- BOSS 战场 -->
    <div class="boss-battlefield" id="bossArea">
        <div style="font-weight: bold; font-size: 18px; color: #f1c40f;" id="bossName">👹 遇到大 BOSS！需要连击一口气把前面 3 句话一并背出输出大招！</div>
        <div class="hp-bar-bg"><div class="hp-bar-fill" id="bossHp"></div></div>
    </div>

    <div class="map-container" id="levelMap"></div>
    <div class="star-reward" id="starContainer"></div>

    <div class="card">
        <div id="badge" style="display:none; font-size:50px;">👑 演说大冠军勋章 👑</div>
        <div class="word-container" id="engText">请在上方配置你的剧本并上传音频。</div>
        <div class="score-box" id="scoreDisplay"></div>
    </div>

    <div class="controls">
        <button id="ttsBtn" onclick="playParentAudio()" disabled>🔊 听家长读</button>
        <button id="micBtn" onclick="toggleListening()" disabled>🎤 我来挑战打怪</button>
        <button id="passBtn" onclick="forcePass()" style="display: none;">⭐ 爸妈判定通过</button>
    </div>

    <div id="statusMessage" style="margin-top: 15px; color: #7f8c8d; font-size: 15px; font-weight: bold;"></div>

    <script>
        let story = []; 
        let nodesData = []; 
        let currentIndex = 0; 
        let clearedLevels = new Set();
        let audioBuffer = null;
        let audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let sentenceTimestamps = []; // 智能侦测出的呼吸换气点
        let isListening = false;
        let currentPlaybackRate = 1.0;
        let highlightTimer = null;
        let activeSourcesList = [];

        function initAudioContext() {
            if (audioContext.state === 'suspended') audioContext.resume();
        }

        // 页面启动自动加载缓存剧本
        window.addEventListener('DOMContentLoaded', () => {
            const cachedText = localStorage.getItem('yimo_speech_text_v5');
            if (cachedText) {
                document.getElementById('textInput').value = cachedText;
                story = cachedText.split("\n").map(l => l.trim()).filter(l => l !== "");
                document.getElementById('audioStatus').innerText = "📂 已自动加载剧本存档，请重新选择音频文件激活关卡！";
            }
        });

        function saveTextToCache() {
            const text = document.getElementById('textInput').value;
            localStorage.setItem('yimo_speech_text_v5', text);
        }

        function clearGameCache() {
            if(confirm("确定要清空温一默的剧本存档吗？")) {
                localStorage.removeItem('yimo_speech_text_v5');
                location.reload();
            }
        }

        function handleAudioUpload(input) {
            initAudioContext();
            const customText = document.getElementById('textInput').value.trim();
            if(!customText) {
                alert("请先输入演讲稿英文（一句一行），再导入音频。");
                input.value = "";
                return;
            }

            story = customText.split("\n").map(l => l.trim()).filter(l => l !== "");

            const file = input.files[0];
            if (!file) return;
            document.getElementById('audioStatus').innerText = "⚡ 正在智能捕获音频中的呼吸停顿点并切分...";
            
            const reader = new FileReader();
            reader.onload = function(e) {
                audioContext.decodeAudioData(e.target.result, function(buffer) {
                    audioBuffer = buffer;
                    sliceAudioIntelligently(buffer, story.length);
                });
            };
            reader.readAsArrayBuffer(file);
        }

        // 终极黑科技：根据需要切分的句数（如19句），全自动寻找前 18 次最长的呼吸/停顿间隙！
        function sliceAudioIntelligently(buffer, numLines) {
            const rawData = buffer.getChannelData(0);
            const sampleRate = buffer.sampleRate;
            const stepSize = Math.floor(sampleRate * 0.05); // 以50毫秒为单位扫描
            const segments = Math.floor(rawData.length / stepSize);

            let energies = [];
            let totalEnergy = 0;
            for (let i = 0; i < segments; i++) {
                let sum = 0;
                for (let j = 0; j < stepSize; j++) {
                    sum += Math.abs(rawData[i * stepSize + j]);
                }
                let avg = sum / stepSize;
                energies.push(avg);
                totalEnergy += avg;
            }

            // 动态底噪阈值：取平均能量的 25% 作为静音/呼吸的判断线
            let avgEnergy = totalEnergy / energies.length;
            let threshold = avgEnergy * 0.25; 

            let silenceGaps = [];
            let currentGap = null;

            for (let i = 0; i < energies.length; i++) {
                if (energies[i] < threshold) {
                    if (!currentGap) currentGap = { start: i * 0.05, length: 0 };
                    currentGap.length += 0.05;
                } else {
                    if (currentGap) {
                        // 过滤掉极短的停顿，保留大于 0.2秒的换气空隙
                        if (currentGap.length > 0.2) {
                            silenceGaps.push(currentGap);
                        }
                        currentGap = null;
                    }
                }
            }
            if (currentGap && currentGap.length > 0.2) silenceGaps.push(currentGap);

            let numCuts = numLines - 1;
            sentenceTimestamps = [0];

            if (silenceGaps.length >= numCuts && numCuts > 0) {
                // 找出时间最长的那 N-1 个大停顿
                silenceGaps.sort((a, b) => b.length - a.length);
                let selectedGaps = silenceGaps.slice(0, numCuts);
                // 再把它们按照播放的先后顺序排列
                selectedGaps.sort((a, b) => a.start - b.start);

                selectedGaps.forEach(gap => {
                    // 完美的切分点就在停顿的正中间
                    sentenceTimestamps.push(parseFloat((gap.start + gap.length / 2).toFixed(3)));
                });
            } else {
                // 备用兜底方案：如果环境太嘈杂，按字数比例切分
                let wordCounts = story.map(sentence => sentence.split(" ").filter(Boolean).length);
                let totalWords = wordCounts.reduce((a, b) => a + b, 0) || 1;
                let currentAccumulatedTime = 0;
                for (let i = 0; i < numCuts; i++) {
                    let sentenceRatio = wordCounts[i] / totalWords;
                    let sentenceDuration = buffer.duration * sentenceRatio;
                    currentAccumulatedTime += sentenceDuration;
                    sentenceTimestamps.push(parseFloat(currentAccumulatedTime.toFixed(3)));
                }
            }
            sentenceTimestamps.push(buffer.duration);

            build31GameMap(story.length);
        }

        // 完美修复的逻辑：关卡数字死死对应原剧本的行数！
        function build31GameMap(totalSentencesCount) {
            nodesData = [];
            let comboTracker = [];

            story.forEach((sentence, idx) => {
                // label 强行使用剧本的行号（idx + 1），防止 BOSS 顶占数字位置
                nodesData.push({ type: 'normal', scriptIdx: idx, label: idx + 1, en: sentence });
                comboTracker.push({ scriptIdx: idx, mapIdx: nodesData.length - 1 });

                // 满 3 句追加一个 BOSS 大招关
                if (comboTracker.length === 3 || idx === story.length - 1) {
                    nodesData.push({ type: 'boss', targetNodesInfo: [...comboTracker], label: 'BOSS' });
                    comboTracker = [];
                }
            });

            const mapContainer = document.getElementById('levelMap');
            mapContainer.innerHTML = "";
            nodesData.forEach((node, idx) => {
                const div = document.createElement('div');
                div.className = `level-node ${node.type === 'boss' ? 'boss-node' : ''} ${idx === 0 ? 'active' : ''}`;
                div.id = `node-${idx}`;
                div.innerText = node.label;
                div.onclick = () => loadLevel(idx);
                mapContainer.appendChild(div);
            });

            document.getElementById('audioStatus').innerText = `✅ 全自动对齐成功！已揪出呼吸断点，生成 ${totalSentencesCount} 个小关卡！`;
            document.getElementById('ttsBtn').disabled = false;
            document.getElementById('micBtn').disabled = false;
            document.getElementById('passBtn').style.display = 'inline-block';
            loadLevel(0);
        }

        function renderSubtitle(node) {
            const container = document.getElementById('engText');
            container.innerHTML = "";
            clearInterval(highlightTimer);
            let wordTrackingArray = [];

            if (nodesData.length === 0) return wordTrackingArray;

            if (node.type === 'normal') {
                const div = document.createElement('div');
                div.className = "word-container";
                node.en.split(" ").forEach((word, wIdx) => {
                    const span = document.createElement('span');
                    span.className = 'word-span';
                    span.id = `span-0-${wIdx}`;
                    span.innerText = word + " ";
                    div.appendChild(span);
                    wordTrackingArray.push(`span-0-${wIdx}`);
                });
                container.appendChild(div);
            } else {
                node.targetNodesInfo.forEach((info, order) => {
                    const blockDiv = document.createElement('div');
                    blockDiv.className = `boss-sentence-block b-block-${order}`;
                    if(order === 0) blockDiv.classList.add('active-sentence');
                    
                    const englishRow = document.createElement('div');
                    englishRow.className = 'boss-english-row';
                    nodesData[info.mapIdx].en.split(" ").forEach((word, wIdx) => {
                        const span = document.createElement('span');
                        span.className = 'word-span';
                        span.id = `span-${order}-${wIdx}`;
                        span.innerText = word + " ";
                        englishRow.appendChild(span);
                        wordTrackingArray.push({ id: `span-${order}-${wIdx}`, block: order });
                    });
                    blockDiv.appendChild(englishRow);
                    container.appendChild(blockDiv);
                });
            }
            return wordTrackingArray;
        }

        function playParentAudio() {
            initAudioContext();
            activeSourcesList.forEach(s => { try{ s.stop(); }catch(e){} });
            activeSourcesList = [];
            clearInterval(highlightTimer);

            const node = nodesData[currentIndex];
            if (!audioBuffer) return;

            let playQueue = [];
            let totalDuration = 0;

            if (node.type === 'normal') {
                let start = sentenceTimestamps[node.scriptIdx];
                let end = sentenceTimestamps[node.scriptIdx + 1];
                playQueue.push({ start, duration: end - start, delay: 0 });
                totalDuration = (end - start) / currentPlaybackRate;
            } else {
                let currentDelay = 0;
                node.targetNodesInfo.forEach(info => {
                    let start = sentenceTimestamps[info.scriptIdx];
                    let end = sentenceTimestamps[info.scriptIdx + 1];
                    playQueue.push({ start, duration: end - start, delay: currentDelay });
                    currentDelay += ((end - start) / currentPlaybackRate);
                });
                totalDuration = currentDelay;
            }

            const wordIdList = renderSubtitle(node);
            let timePerWord = (totalDuration * 1000) / wordIdList.length;
            let currentWordPointer = 0;

            highlightTimer = setInterval(() => {
                document.querySelectorAll('.word-span').forEach(s => s.classList.remove('highlight'));
                let currentItem = wordIdList[currentWordPointer];
                if (currentItem) {
                    let targetId = typeof currentItem === 'string' ? currentItem : currentItem.id;
                    if(typeof currentItem === 'object') {
                        document.querySelectorAll('.boss-sentence-block').forEach(b => b.classList.remove('active-sentence'));
                        document.querySelector(`.b-block-${currentItem.block}`).classList.add('active-sentence');
                    }
                    const currentSpan = document.getElementById(targetId);
                    if (currentSpan) currentSpan.classList.add('highlight');
                    currentWordPointer++;
                } else {
                    clearInterval(highlightTimer);
                }
            }, timePerWord);

            playQueue.forEach(item => {
                setTimeout(() => {
                    if (nodesData[currentIndex] !== node) return;
                    let source = audioContext.createBufferSource();
                    source.buffer = audioBuffer;
                    source.playbackRate.value = currentPlaybackRate;
                    source.connect(audioContext.destination);
                    source.start(0, item.start, item.duration);
                    activeSourcesList.push(source);
                }, item.delay * 1000);
            });
        }

        function loadLevel(idx) {
            if (nodesData.length === 0) return;
            if (idx > 0 && !clearedLevels.has(idx - 1) && idx !== currentIndex) {
                document.getElementById('statusMessage').innerText = "🔒 前方的领地还在被怪兽占领哦！";
                return;
            }
            activeSourcesList.forEach(s => { try{ s.stop(); }catch(e){} });
            clearInterval(highlightTimer);
            
            currentIndex = idx;
            const node = nodesData[idx];
            
            renderSubtitle(node);
            document.getElementById('scoreDisplay').innerText = "";
            
            const bossArea = document.getElementById('bossArea');
            if (node.type === 'boss') {
                bossArea.style.display = 'block';
                document.getElementById('bossHp').style.width = '100%';
                document.getElementById('bossName').innerText = `👹 遇到镇关大 BOSS！请连续一口气把前面 ${node.targetNodesInfo.length} 句话一并背诵出来释放绝招！`;
                playBossRoar();
            } else {
                bossArea.style.display = 'none';
            }
            
            document.querySelectorAll('.level-node').forEach((n, nIdx) => {
                n.classList.remove('active');
                if (nIdx === currentIndex) n.classList.add('active');
            });
            updateStars();
        }

        function calculateKidsComboScore(node, recognized) {
            let targetText = "";
            if (node.type === 'normal') targetText = node.en;
            else node.targetNodesInfo.forEach(info => { targetText += " " + nodesData[info.mapIdx].en; });

            let arr1 = targetText.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?'"]/g,"").split(" ").filter(Boolean);
            let arr2 = recognized.toLowerCase().split(" ").filter(Boolean);
            
            let match = 0;
            arr1.forEach(w => { if(arr2.includes(w)) match++ });
            let baseRate = match / arr1.length;
            
            if (baseRate >= 0.25) return Math.min(100, Math.floor(93 + (baseRate * 7))); 
            else if (baseRate > 0) return 76;
            return 35; 
        }

        function updateStars() {
            let stars = "";
            nodesData.forEach((node, i) => {
                if (node.type === 'boss') stars += clearedLevels.has(i) ? "💀 " : "😈 ";
                else stars += clearedLevels.has(i) ? "⭐ " : "⚪ ";
            });
            document.getElementById('starContainer').innerText = stars;

            if (clearedLevels.size === nodesData.length && nodesData.length > 0) {
                document.getElementById('badge').style.display = 'block';
                document.getElementById('engText').innerText = "🎉 恭喜文一墨通关全部大挑战！成为演说小冠军！";
            }
        }

        function forcePass() {
            clearedLevels.add(currentIndex);
            const node = nodesData[currentIndex];
            if (node.type === 'boss') {
                document.getElementById('bossHp').style.width = '0%';
                document.getElementById('bossName').innerText = "💥 连击吟唱成功！大 BOSS 被你瞬间秒杀啦！";
                playExplodeSound();
            } else {
                playCorrectSound();
            }
            document.getElementById(`node-${currentIndex}`).classList.add('cleared');
            setTimeout(() => {
                if (currentIndex < nodesData.length - 1) loadLevel(currentIndex + 1);
                else updateStars();
            }, 1200);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            
            recognition.onstart = () => {
                isListening = true;
                document.getElementById('micBtn').className = "recording";
                document.getElementById('micBtn').innerText = "🛑 正在听...";
                document.getElementById('statusMessage').innerText = "🎤 魔法麦克风吸音就绪，温一默开始背诵吧！";
                
                const node = nodesData[currentIndex];
                let durationEstimate = node.type === 'normal' ? 5 : 12;
                let wordsCount = document.querySelectorAll('.word-span').length;
                let step = (durationEstimate * 1000) / wordsCount;
                let count = 0;
                clearInterval(highlightTimer);
                highlightTimer = setInterval(() => {
                    document.querySelectorAll('.word-span').forEach(s => s.classList.remove('highlight'));
                    let sp = document.querySelectorAll('.word-span')[count];
                    if(sp) { sp.classList.add('highlight'); count++; }
                    else clearInterval(highlightTimer);
                }, step);
            };
            
            recognition.onend = () => {
                isListening = false;
                document.getElementById('micBtn').className = "";
                document.getElementById('micBtn').innerText = "🎤 我来挑战打怪";
            };
            
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                const node = nodesData[currentIndex];
                let finalScore = calculateKidsComboScore(node, text);

                document.getElementById('scoreDisplay').innerText = finalScore + "分";
                if (finalScore >= 80) {
                    document.getElementById('statusMessage').innerHTML = `🌟 攻击有力！成功通关！<br><span style='font-size:13px; color:#aaa'>听到的是: "${text}"</span>`;
                    forcePass();
                } else {
                    document.getElementById('statusMessage').innerHTML = `👍 已经背得很不错了，多听听家长的录音，再来试一次！`;
                    playErrorSound();
                }
            };
        }

       // 替换掉之前旧的 toggleListening 函数和识别逻辑，改为“防抖动完整句”逻辑
let recognition;
let isKidsListening = false;
let finalTranscript = ""; // 缓存整句识别结果

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = true; // 开启连续监听
    recognition.interimResults = true; // 开启中间结果显示

    recognition.onstart = () => {
        isKidsListening = true;
        finalTranscript = ""; // 重置缓冲区
        document.getElementById('micBtn').className = "recording";
        document.getElementById('micBtn').innerText = "🛑 我在听...";
        document.getElementById('statusMessage').innerText = "🎤 正在倾听，请完整读完，读完请稍作停顿...";
    };

    recognition.onresult = (event) => {
        let interimTranscript = "";
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
                finalTranscript += event.results[i][0].transcript;
            } else {
                interimTranscript += event.results[i][0].transcript;
            }
        }
        
        // 显示当前读到的内容，但暂不触发评分
        document.getElementById('engText').innerText = finalTranscript || interimTranscript;
    };

    recognition.onend = () => {
        // 只有当识别器停止（小朋友读完停顿）后，才触发最终评分
        if (isKidsListening) {
            // 给系统一点缓冲，如果还有声音说明是在换气，继续监听
            setTimeout(() => {
                if (finalTranscript.length > 5) {
                    processFinalScore(finalTranscript);
                }
            }, 1500); 
        }
    };
}

function processFinalScore(text) {
    const node = nodesData[currentIndex];
    let targetText = node.type === 'normal' ? node.en : nodesData[node.targetNodesInfo[node.targetNodesInfo.length - 1].mapIdx].en;
    
    // 计算对比度：计算原句在识别文本中出现的比例
    let targetWords = targetText.toLowerCase().split(" ").filter(Boolean);
    let spokenWords = text.toLowerCase().split(" ").filter(Boolean);
    
    let matchCount = 0;
    targetWords.forEach(w => { if(spokenWords.includes(w)) matchCount++ });
    
    // 强制完整度逻辑：读对 80% 以上才给高分，否则提醒重读
    let accuracy = matchCount / targetWords.length;
    let finalScore = Math.floor(accuracy * 100);

    if (accuracy >= 0.7) { // 只有读得非常完整才判定通过
        document.getElementById('scoreDisplay').innerText = finalScore + "分";
        document.getElementById('statusMessage').innerHTML = `🌟 太棒了！你的演说非常完整！`;
        forcePass();
    } else {
        document.getElementById('scoreDisplay').innerText = finalScore + "分";
        document.getElementById('statusMessage').innerHTML = `💡 读得不错，但还需要更完整一点！加油！`;
        playErrorSound();
        // 重置状态
        document.getElementById('micBtn').className = "";
        document.getElementById('micBtn').innerText = "🎤 我来挑战打怪";
        isKidsListening = false;
    }
}

function toggleListening() {
    initAudioContext();
    if (isKidsListening) {
        recognition.stop(); 
        isKidsListening = false;
    } else {
        recognition.start();
    }
}

        function playCorrectSound() {
            let osc = audioContext.createOscillator(); let gain = audioContext.createGain();
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.frequency.setValueAtTime(523.25, audioContext.currentTime);
            osc.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, audioContext.currentTime);
            osc.start(); osc.stop(audioContext.currentTime + 0.15);
        }
        function playErrorSound() {
            let osc = audioContext.createOscillator(); let gain = audioContext.createGain();
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.type = 'triangle'; osc.frequency.setValueAtTime(349.23, audioContext.currentTime);
            gain.gain.setValueAtTime(0.15, audioContext.currentTime);
            osc.start(); osc.stop(audioContext.currentTime + 0.15);
        }
        function playBossRoar() {
            let osc = audioContext.createOscillator(); let gain = audioContext.createGain();
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.type = 'sawtooth'; osc.frequency.linearRampToValueAtTime(120, audioContext.currentTime + 0.5);
            gain.gain.setValueAtTime(0.2, audioContext.currentTime);
            osc.start(); osc.stop(audioContext.currentTime + 0.5);
        }
        function playExplodeSound() {
            let osc = audioContext.createOscillator(); let gain = audioContext.createGain();
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioContext.currentTime + 0.6);
            gain.gain.setValueAtTime(0.25, audioContext.currentTime);
            osc.start(); osc.stop(audioContext.currentTime + 0.6);
        }
