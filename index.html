<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/peach.png">
    <link rel="icon" href="https://img.icons8.com/color/512/peach.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">    
    <title>文一墨的纯英演说大冒险 🌸</title>
    <style>
        :root {
            --primary-color: #ff7675;
            --success-color: #2ecc71;
            --accent-color: #f1c40f;
            --boss-color: #9b59b6;
            --hp-color: #e74c3c;
            --parent-color: #00cec9;
            --admin-color: #6c5ce7;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fff0f0 100%);
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 15px;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 { color: #d32f2f; margin-bottom: 5px; font-size: 28px; }
        
        /* 🕹️ 首页精简版选课中心布局 */
        .game-top-bar {
            background: white; padding: 15px; border-radius: 20px;
            box-shadow: 0 8px 24px rgba(211,47,47,0.04); margin-bottom: 15px;
            text-align: left; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
        }
        .course-selector {
            padding: 10px; border-radius: 10px; border: 2px solid var(--primary-color);
            font-size: 16px; background: #fafafa; flex: 1; min-width: 200px; font-weight: bold; color: #2c3e50;
        }
        
        /* 🛠️ 课本工厂遮罩弹窗层样式 */
        .modal-overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 25px; border-radius: 24px; width: 90%; max-width: 650px;
            max-height: 85vh; overflow-y: auto; text-align: left; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .modal-content textarea {
            width: 100%; height: 130px; margin-top: 5px; margin-bottom: 15px;
            border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box;
            font-size: 14px; line-height: 1.4;
        }
        .modal-input {
            width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box;
        }

        .map-container {
            display: flex; justify-content: center; flex-wrap: wrap; gap: 12px;
            margin: 15px auto; padding: 15px; background: rgba(255, 255, 255, 0.85);
            border-radius: 20px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
        }
        .level-node {
            width: 45px; height: 45px; border-radius: 50%; background: #dfe6e9; color: #b2bec3;
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px;
            border: 3px solid #b2bec3; cursor: pointer; position: relative;
        }
        .level-node.boss-node::after { content: '👹'; position: absolute; top: -12px; right: -12px; font-size: 16px; }
        .level-node.active { background: var(--primary-color); color: white; border-color: #d63031; transform: scale(1.1); }
        .level-node.boss-node.active { background: var(--boss-color); border-color: #8e44ad; }
        .level-node.cleared { background: var(--success-color); color: white; border-color: #27ae60; }

        .boss-battlefield {
            display: none; background: #2c3e50; color: white; padding: 15px; border-radius: 16px; margin-bottom: 15px;
        }
        .hp-bar-bg { width: 100%; background: #7f8c8d; height: 15px; border-radius: 10px; margin-top: 5px; overflow: hidden; }
        .hp-bar-fill { width: 100%; background: var(--hp-color); height: 100%; transition: width 0.5s; }

        .card {
            background: white; border-radius: 24px; padding: 35px 25px;
            box-shadow: 0 10px 30px rgba(211, 47, 47, 0.06); border: 2px solid #ffe0e0; margin-bottom: 15px;
        }
        .word-container { font-size: 26px; font-weight: bold; color: #2c3e50; line-height: 1.6; margin-bottom: 15px; min-height: 80px; text-align: left; }
        
        .boss-sentence-block {
            margin-bottom: 15px; padding: 12px 15px; border-radius: 12px;
            border-left: 5px solid #dfe6e9; text-align: left; background: #fafafa;
        }
        .boss-sentence-block.active-sentence {
            border-left-color: var(--boss-color); background: rgba(155, 89, 182, 0.04);
        }
        .boss-english-row { font-size: 24px; font-weight: bold; color: #2c3e50; line-height: 1.5; }

        .word-span { display: inline-block; margin: 0 4px; transition: color 0.15s, transform 0.15s; }
        .word-span.highlight { color: #f39c12; transform: scale(1.15); text-shadow: 0 0 5px rgba(243,156,18,0.3); }
        .score-box { font-size: 45px; font-weight: bold; margin-top: 10px; color: var(--primary-color); }
        
        .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
        button {
            background-color: var(--primary-color); color: white; border: none; padding: 14px 30px;
            font-size: 18px; font-weight: bold; border-radius: 35px; cursor: pointer; box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }
        button:disabled { background-color: #b2bec3; cursor: not-allowed; }
        #micBtn { background-color: #0984e3; }
        #micBtn.recording { background-color: #e17055; animation: pulse 1s infinite; }
        #passBtn { background-color: var(--success-color); }
        #playMyAudioBtn { background-color: #9b59b6; }
        #playHistoryAudioBtn { background-color: #16a085; }
        #playParentAudioBtn { background-color: var(--parent-color); } 
        
        /* 顶部功能按钮群 */
        .top-btn { padding: 10px 16px; font-size: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; border: none; color: white;}
        .factory-btn { background-color: var(--admin-color); }
        .reset-btn { background-color: #f39c12; }
        .delete-btn { background-color: #e74c3c; }
        .save-btn { background-color: #2ecc71; width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; margin-top: 10px;}
        .close-btn { background-color: #95a5a6; padding: 6px 12px; font-size: 12px; border-radius: 6px; float: right; cursor: pointer; color: white; border:none;}
    </style>
</head>
<body>

    <h1>🌸 文一墨的纯英演说大冒险 🌸</h1>
    
    <!-- 🕹️ 极简首页顶部控制中心 -->
    <div class="game-top-bar">
        <select id="courseSelect" class="course-selector" onchange="switchCourse()">
            <option value="">-- 🔍 戳这里挑选你想挑战的课本 --</option>
        </select>
        
        <div style="display: flex; gap: 8px;">
            <button class="top-btn reset-btn" onclick="resetCurrentCourseProgress()">🔄 重新挑战本课</button>
            <button class="top-btn factory-btn" onclick="openFactoryModal()">🛠️ 制作/管理课本</button>
        </div>
    </div>

    <!-- 🛠️ 隐藏的课本制作加工厂（独立弹窗页面） -->
    <div id="factoryModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="closeFactoryModal()">❌ 关闭管理台</button>
            <h2 style="margin-top: 0; color: var(--admin-color);">🛠️ 文一墨的课本秘密加工厂</h2>
            <hr style="border: 1px solid #eee; margin-bottom: 15px;">
            
            <label style="font-weight: bold; color: #2c3e50;">1️⃣ 局域网 NAS 中转站 IP 配置：</label>
            <input type="text" id="nasIpInput" class="modal-input" placeholder="例如: http://192.168.50.142:5034" oninput="localStorage.setItem('yimo_nas_ip', this.value)">

            <label style="font-weight: bold; color: #2c3e50; display: block;">2️⃣ 剧本内容粘贴区（严格一句一行，自动兼容中文注释）：</label>
            <textarea id="textInput" placeholder="Hello everyone, I’m Wen Yimo...\nSichuan is a beautiful place..."></textarea>

            <label style="font-weight: bold; color: #2c3e50; display: block;">3️⃣ 导入家长录制的完整示范长录音 (选填)：</label>
            <input type="file" id="audioFile" accept="audio/*" class="modal-input" style="border: 1px dashed var(--admin-color); padding: 8px;" onchange="handleAudioUpload(this)">
            <div id="audioStatus" style="font-size: 13px; color: #7f8c8d; font-weight: bold; margin-top: -10px; margin-bottom: 15px;">🔍 选填项目。导入后系统会自动进行声音呼吸停顿点对齐[cite: 5]。</div>

            <label style="font-weight: bold; color: #2c3e50; display: block;">4️⃣ 默认微软 AI 磨耳朵声优：</label>
            <select id="voiceSelect" class="modal-input" style="padding: 8px;">
                <option value="en-US-AnaNeural">👶 活泼童声 - Ana (最适合小朋友)</option>
                <option value="en-US-AriaNeural">👩 亲切女声 - Aria (标准美音)</option>
                <option value="en-US-ChristopherNeural">👨 浑厚男声 - Christopher (充满力量感)</option>
                <option value="en-US-SoniaNeural">👸 优雅英音 - Sonia (标准伦敦腔)</option>
            </select>

            <button class="save-btn" onclick="saveNewBookToDatabase()">💾 打包封装并保存为新课本</button>
            <button class="top-btn delete-btn" style="width: 100%; margin-top: 8px; padding: 10px; border-radius: 12px;" onclick="deleteCurrentCourse()">🗑️ 销毁当前选中的旧课本</button>
        </div>
    </div>

    <!-- 👹 BOSS 战场 -->
    <div class="boss-battlefield" id="bossArea">
        <div style="font-weight: bold; font-size: 18px; color: #f1c40f;" id="bossName">👹 遇到大 BOSS！需要连击一口气把前面 3 句话一并背出输出大招！</div>
        <div class="hp-bar-bg"><div class="hp-bar-fill" id="bossHp"></div></div>
    </div>

    <!-- 🗺️ 地图关卡区 -->
    <div class="map-container" id="levelMap"></div>
    <div class="star-reward" id="starContainer"></div>

    <!-- 📖 字幕看板 -->
    <div class="card">
        <div id="badge" style="display:none; font-size:50px;">👑 演说大冠军勋章 👑</div>
        <div class="word-container" id="engText">请在右上方打开管理台制作课本，或者在左侧下拉菜单选择课本开启大冒险！</div>
        <div class="score-box" id="scoreDisplay"></div>
    </div>

    <!-- 🕹️ 游戏控制台 -->
    <div class="controls">
        <button id="ttsBtn" onclick="playMicrosoftAudio()" disabled>🔊 听 AI 外教读</button>
        <button id="playParentAudioBtn" onclick="playParentAudio()" style="display: none;">🔊 听家长读</button>
        <button id="playMyAudioBtn" onclick="playKidsAudio()" style="display: none;">🎧 听这次录音</button>
        <button id="playHistoryAudioBtn" onclick="playHistoryPassAudio()" style="display: none;">🎧 听历史通关录音</button>
        
        <button id="micBtn" onclick="toggleSmartAutoRecording()" disabled>🎤 我来挑战打怪</button>
        <button id="passBtn" onclick="forcePass()" style="display: none;">⭐ 爸妈判定通过</button>
    </div>

    <div id="statusMessage" style="margin-top: 15px; color: #7f8c8d; font-size: 15px; font-weight: bold;"></div>

    <script>
        let audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        let story = []; let nodesData = []; let currentIndex = 0; let clearedLevels = new Set();
        let isListening = false; let currentPlaybackRate = 1.0; let highlightTimer = null; let currentAiAudio = null;

        let audioBuffer = null; let sentenceTimestamps = []; let activeSourcesList = [];
        let kidsMediaRecorder = null; let kidsAudioChunks = [];
        let kidsAudioBlobUrl = null; let currentPassAudioBlob = null; let historyPassAudioUrl = null;    
        let kidsAudioPlayer = new Audio();

        // 智能声音雷达感知参数（8.0秒耐心等待）
        let audioStream = null; let meterProcessor = null; let silenceStartTime = null; let lastVoiceDetectedTime = null;
        const SILENCE_THRESHOLD = 0.015; const MAX_SILENCE_DURATION = 8000; 

        let courseDatabase = {}; let dbInstance = null; 

        function initAudioContext() { if (audioContext.state === 'suspended') audioContext.resume(); }

        window.addEventListener('DOMContentLoaded', () => {
            const cachedNasIp = localStorage.getItem('yimo_nas_ip');
            if (cachedNasIp) document.getElementById('nasIpInput').value = cachedNasIp;
            else document.getElementById('nasIpInput').value = "http://192.168.50.142:5034"; 
            initIndexedDB().then(() => { loadCourseDatabase(); });
        });

        // =================【📀 局域网大容量多轨数据库引擎】=================
        function initIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("YimoVoiceStorageV3", 3);
                request.onupgradeneeded = (e) => {
                    let db = e.target.result;
                    if (!db.objectStoreNames.contains("passed_voices")) db.createObjectStore("passed_voices", { keyPath: "id" });
                    if (!db.objectStoreNames.contains("parent_long_buffers")) db.createObjectStore("parent_long_buffers", { keyPath: "id" });
                };
                request.onsuccess = (e) => { dbInstance = e.target.result; resolve(); };
                request.onerror = () => { reject(); };
            });
        }

        function saveAudioToDB(storeName, key, data) {
            if (!dbInstance || !data) return;
            const transaction = dbInstance.transaction([storeName], "readwrite");
            transaction.objectStore(storeName).put({ id: key, rawData: data, timestamp: Date.now() });
        }

        function getAudioFromDB(storeName, key) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve(null);
                const transaction = dbInstance.transaction([storeName], "readonly");
                const request = transaction.objectStore(storeName).get(key);
                request.onsuccess = (e) => { if (e.target.result) resolve(e.target.result.rawData); else resolve(null); };
                request.onerror = () => resolve(null);
            });
        }

        function deleteCourseDataFromDB(courseName) {
            if (!dbInstance) return;
            ["passed_voices", "parent_long_buffers"].forEach(storeName => {
                const transaction = dbInstance.transaction([storeName], "readwrite");
                transaction.objectStore(storeName).openCursor().onsuccess = (e) => {
                    const cursor = e.target.result; if (cursor) { if (cursor.key.startsWith(`${courseName}_`) || cursor.key === courseName) cursor.delete(); cursor.continue(); }
                };
            });
        }

        // =================【🎯 弹窗加工厂与数据状态管理器】=================
        function openFactoryModal() { document.getElementById('factoryModal').style.display = 'flex'; }
        function closeFactoryModal() { document.getElementById('factoryModal').style.display = 'none'; }

        function loadCourseDatabase() {
            const cachedDb = localStorage.getItem('yimo_course_db_v1');
            if (cachedDb) courseDatabase = JSON.parse(cachedDb);
            else {
                courseDatabase = { "示例课程：桃园三结义": "Three brave men met in a peach garden.\nThey promised to be brothers.\nThey vowed to protect their country together." };
                localStorage.setItem('yimo_course_db_v1', JSON.stringify(courseDatabase));
            }
            renderCourseDropdown();
            const lastSelectedCourse = localStorage.getItem('yimo_selected_course_name');
            if (lastSelectedCourse && courseDatabase[lastSelectedCourse]) {
                document.getElementById('courseSelect').value = lastSelectedCourse;
                switchCourse();
            }
        }

        function renderCourseDropdown() {
            const select = document.getElementById('courseSelect');
            select.innerHTML = '<option value="">-- 🔍 戳这里挑选你想挑战的课本 --</option>';
            Object.keys(courseDatabase).forEach(courseName => {
                const opt = document.createElement('option'); opt.value = courseName; opt.innerText = courseName; select.appendChild(opt);
            });
        }

        // 课本工厂核心逻辑：封包成独立剧本实体并动态保存
        function saveNewBookToDatabase() {
            const currentText = document.getElementById('textInput').value.trim();
            if (!currentText) { alert("课本剧本内容不能为空哦！"); return; }
            const courseName = prompt("请为这本新课本命名（例如：演说关卡一：自我介绍）：");
            if (!courseName) return;

            courseDatabase[courseName] = currentText;
            localStorage.setItem('yimo_course_db_v1', JSON.stringify(courseDatabase));
            localStorage.setItem('yimo_selected_course_name', courseName);
            
            renderCourseDropdown();
            document.getElementById('courseSelect').value = courseName;
            
            // 初始化全新进度档案
            clearedLevels = new Set();
            saveCourseProgressToStorage(courseName);

            document.getElementById('statusMessage').innerText = `🎉 恭喜！新课本《${courseName}》已成功出版，快去左上角选课中心开启挑战吧！`;
            closeFactoryModal();
            switchCourse();
        }

        async function switchCourse() {
            const select = document.getElementById('courseSelect');
            const selectedName = select.value; if (!selectedName) return;
            
            // 将当前选择同步回管理台
            document.getElementById('textInput').value = courseDatabase[selectedName];
            localStorage.setItem('yimo_selected_course_name', selectedName);
            
            restoreCourseProgress(selectedName);
            
            audioBuffer = null;
            const savedArrayBuffer = await getAudioFromDB("parent_long_buffers", selectedName);
            if (savedArrayBuffer) {
                document.getElementById('audioStatus').innerText = "📂 检测到本地固化的家长发音，已完成无阻碍分句对齐[cite: 5]。";
                audioContext.decodeAudioData(savedArrayBuffer.slice(0), (buffer) => {
                    audioBuffer = buffer;
                    sliceAudioIntelligently(buffer, courseDatabase[selectedName].split("\n").filter(Boolean).length);
                });
            } else {
                document.getElementById('audioStatus').innerText = "⚪ 本课暂无外部长录音，采用自适应跑马灯[cite: 5]。";
                generateGameMap();
            }
        }

        function restoreCourseProgress(courseName) {
            const cachedProgress = localStorage.getItem(`yimo_progress_${courseName}`);
            clearedLevels = cachedProgress ? new Set(JSON.parse(cachedProgress)) : new Set();
        }

        function saveCourseProgressToStorage(courseName) {
            if (!courseName) return;
            localStorage.setItem(`yimo_progress_${courseName}`, JSON.stringify(Array.from(clearedLevels)));
        }

        // 🌟 核心升级：重新挑战时，绝不误杀销毁已经切分好的家长录音资源[cite: 5]！
        function resetCurrentCourseProgress() {
            const select = document.getElementById('courseSelect'); const currentCourseName = select.value;
            if (!currentCourseName) { alert("请先在选课中心选中一门课本。"); return; }
            if (confirm(`🚨 确认重新挑战吗？\n文一墨需要重新从第一关开始，他的历史通关录音会被清空，但【家长的音频和剧本依然原封不动保留】[cite: 5]。`)) {
                clearedLevels = new Set(); 
                saveCourseProgressToStorage(currentCourseName);
                
                // 💡 亮点：只清除孩子的通关音频轨，绝不调用 deleteCourseDataFromDB 摧毁 parent_long_buffers！
                const transaction = dbInstance.transaction(["passed_voices"], "readwrite");
                const store = transaction.objectStore("passed_voices");
                store.openCursor().onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (cursor) {
                        if (cursor.key.startsWith(`${currentCourseName}_`)) cursor.delete();
                        cursor.continue();
                    }
                };
                
                document.getElementById('badge').style.display = 'none';
                generateGameMap(); // 刷新重新开始
                document.getElementById('statusMessage').innerText = `🔄 关卡封印已洗牌！文一墨，开始重新挑战本课本吧！`;
            }
        }

        function deleteCurrentCourse() {
            const select = document.getElementById('courseSelect'); const selectedName = select.value; if (!selectedName) return;
            if (confirm(`确定要彻底粉碎并销毁课本 "${selectedName}" 吗？此操作无法撤销。`)) {
                delete courseDatabase[selectedName]; localStorage.setItem('yimo_course_db_v1', JSON.stringify(courseDatabase));
                deleteCourseDataFromDB(selectedName); localStorage.removeItem(`yimo_progress_${selectedName}`);
                document.getElementById('textInput').value = ""; clearedLevels = new Set(); audioBuffer = null;
                renderCourseDropdown(); document.getElementById('levelMap').innerHTML = ""; document.getElementById('starContainer').innerText = "";
                closeFactoryModal();
                document.getElementById('statusMessage').innerText = `🗑️ 课本 "${selectedName}" 已从本地完全抹除。`;
            }
        }

        function saveTextToCache() { localStorage.setItem('yimo_current_draft', document.getElementById('textInput').value); }

        // =================【🎵 家长声音高精智能捕获与 Web Audio 切片引擎】=================
        function handleAudioUpload(input) {
            initAudioContext(); const customText = document.getElementById('textInput').value.trim();
            if(!customText) { alert("请先输入演讲稿（一句一行），再导入音频。"); input.value = ""; return; }
            story = customText.split("\n").map(l => l.trim()).filter(l => l !== "");
            const file = input.files[0]; if (!file) return;
            document.getElementById('audioStatus').innerText = "⚡ 正在智能分析声音呼吸波形并自动切段[cite: 5]...";
            const select = document.getElementById('courseSelect').value;
            const reader = new FileReader();
            reader.onload = function(e) {
                const rawArrayBuffer = e.target.result;
                if(select) saveAudioToDB("parent_long_buffers", select, rawArrayBuffer.slice(0));
                audioContext.decodeAudioData(rawArrayBuffer, function(buffer) { audioBuffer = buffer; sliceAudioIntelligently(buffer, story.length); });
            };
            reader.readAsArrayBuffer(file);
        }

        function sliceAudioIntelligently(buffer, numLines) {
            const rawData = buffer.getChannelData(0); const sampleRate = buffer.sampleRate; const stepSize = Math.floor(sampleRate * 0.05); const segments = Math.floor(rawData.length / stepSize);
            let energies = []; let totalEnergy = 0;
            for (let i = 0; i < segments; i++) { let sum = 0; for (let j = 0; j < stepSize; j++) { sum += Math.abs(rawData[i * stepSize + j]); } let avg = sum / stepSize; energies.push(avg); totalEnergy += avg; }
            let threshold = (totalEnergy / energies.length) * 0.25; let silenceGaps = []; let currentGap = null;
            for (let i = 0; i < energies.length; i++) { if (energies[i] < threshold) { if (!currentGap) currentGap = { start: i * 0.05, length: 0 }; currentGap.length += 0.05; } else { if (currentGap) { if (currentGap.length > 0.2) silenceGaps.push(currentGap); currentGap = null; } } }
            if (currentGap && currentGap.length > 0.2) silenceGaps.push(currentGap);
            let numCuts = numLines - 1; sentenceTimestamps = [0];
            if (silenceGaps.length >= numCuts && numCuts > 0) {
                silenceGaps.sort((a, b) => b.length - a.length); let selectedGaps = silenceGaps.slice(0, numCuts); selectedGaps.sort((a, b) => a.start - b.start);
                selectedGaps.forEach(gap => { sentenceTimestamps.push(parseFloat((gap.start + gap.length / 2).toFixed(3))); });
            } else {
                let wordCounts = story.map(s => s.split(" ").filter(Boolean).length); let totalWords = wordCounts.reduce((a, b) => a + b, 0) || 1; let currentAccumulatedTime = 0;
                for (let i = 0; i < numCuts; i++) { currentAccumulatedTime += (buffer.duration * (wordCounts[i] / totalWords)); sentenceTimestamps.push(parseFloat(currentAccumulatedTime.toFixed(3))); }
            }
            sentenceTimestamps.push(buffer.duration); generateGameMap();
        }

        // =================【🎮 游戏大冒险游玩主程序】=================
        function generateGameMap() {
            const customText = document.getElementById('textInput').value.trim(); if(!customText) return;
            story = customText.split("\n").map(l => l.trim()).filter(l => l !== ""); nodesData = []; let comboTracker = [];
            story.forEach((sentence, idx) => {
                // 亮点：智能剔除中文及中文括号括号内容，保证朗读时和高亮对齐毫无错乱
                let pureEnglish = sentence.replace(/[\u4e00-\u9fa5]|（[^）]*）|\([^)]*\)/g, "").trim();
                nodesData.push({ type: 'normal', scriptIdx: idx, label: idx + 1, en: pureEnglish }); comboTracker.push({ scriptIdx: idx, mapIdx: nodesData.length - 1 });
                if (comboTracker.length === 3 || idx === story.length - 1) { nodesData.push({ type: 'boss', targetNodesInfo: [...comboTracker], label: 'BOSS' }); comboTracker = []; }
            });

            const mapContainer = document.getElementById('levelMap'); mapContainer.innerHTML = ""; let autoTargetIdx = 0; let foundTarget = false;
            nodesData.forEach((node, idx) => {
                const isCleared = clearedLevels.has(idx); const div = document.createElement('div');
                div.className = `level-node ${node.type === 'boss' ? 'boss-node' : ''} ${isCleared ? 'cleared' : ''}`;
                div.id = `node-${idx}`; div.innerText = node.label; div.onclick = () => loadLevel(idx); mapContainer.appendChild(div);
                if (!isCleared && !foundTarget) { autoTargetIdx = idx; foundTarget = true; }
            });
            if (!foundTarget && nodesData.length > 0) autoTargetIdx = nodesData.length - 1;
            document.getElementById('ttsBtn').disabled = false; document.getElementById('micBtn').disabled = false;
            document.getElementById('passBtn').style.display = 'inline-block';
            updateStars(); loadLevel(autoTargetIdx);
        }

        function renderSubtitle(node) {
            const container = document.getElementById('engText'); container.innerHTML = ""; clearInterval(highlightTimer); let wordTrackingArray = []; if (nodesData.length === 0) return wordTrackingArray;
            if (node.type === 'normal') {
                const div = document.createElement('div'); div.className = "word-container";
                node.en.split(" ").filter(Boolean).forEach((word, wIdx) => { const span = document.createElement('span'); span.className = 'word-span'; span.id = `span-0-${wIdx}`; span.innerText = word + " "; div.appendChild(span); wordTrackingArray.push(`span-0-${wIdx}`); }); container.appendChild(div);
            } else {
                node.targetNodesInfo.forEach((info, order) => {
                    const blockDiv = document.createElement('div'); blockDiv.className = `boss-sentence-block b-block-${order}`; if(order === 0) blockDiv.classList.add('active-sentence');
                    const englishRow = document.createElement('div'); englishRow.className = 'boss-english-row';
                    nodesData[info.mapIdx].en.split(" ").filter(Boolean).forEach((word, wIdx) => { const span = document.createElement('span'); span.className = 'word-span'; span.id = `span-${order}-${wIdx}`; span.innerText = word + " "; englishRow.appendChild(span); wordTrackingArray.push({ id: `span-${order}-${wIdx}`, block: order }); });
                    blockDiv.appendChild(englishRow); container.appendChild(blockDiv);
                });
            }
            return wordTrackingArray;
        }

        async function playMicrosoftAudio() {
            if (currentAiAudio) currentAiAudio.pause(); if (kidsAudioPlayer && !kidsAudioPlayer.paused) kidsAudioPlayer.pause();
            activeSourcesList.forEach(s => { try{ s.stop(); }catch(e){} }); clearInterval(highlightTimer);
            const node = nodesData[currentIndex]; if (!node) return;
            let textToSpeak = node.type === 'normal' ? node.en : node.targetNodesInfo.map(info => nodesData[info.mapIdx].en).join(". ");
            const apiEndpoint = document.getElementById('nasIpInput').value.trim(); const voiceType = document.getElementById('voiceSelect').value;
            let requestUrl = apiEndpoint.endsWith('/api/tts') ? apiEndpoint : apiEndpoint.replace(/\/$/, '') + '/api/tts';
            try {
                const response = await fetch(requestUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: textToSpeak, voice_type: voiceType, speed: currentPlaybackRate }) });
                const blob = await response.blob(); const audioUrl = URL.createObjectURL(blob);
                currentAiAudio = new Audio(audioUrl); currentAiAudio.play();
                const wordIdList = renderSubtitle(node); let timePerWord = (380 / currentPlaybackRate); let currentWordPointer = 0;
                highlightTimer = setInterval(() => {
                    document.querySelectorAll('.word-span').forEach(s => s.classList.remove('highlight')); let currentItem = wordIdList[currentWordPointer];
                    if (currentItem) {
                        let targetId = typeof currentItem === 'string' ? currentItem : currentItem.id;
                        if(typeof currentItem === 'object') { document.querySelectorAll('.boss-sentence-block').forEach(b => b.classList.remove('active-sentence')); document.querySelector(`.b-block-${currentItem.block}`).classList.add('active-sentence'); }
                        const currentSpan = document.getElementById(targetId); if (currentSpan) currentSpan.classList.add('highlight'); currentWordPointer++;
                    } else clearInterval(highlightTimer);
                }, timePerWord);
            } catch (err) { document.getElementById('statusMessage').innerText = "❌ 调取 AI 失败，请检查 5034 容器状态。"; }
        }

        function playParentAudio() {
            initAudioContext(); if (currentAiAudio) currentAiAudio.pause(); if (kidsAudioPlayer && !kidsAudioPlayer.paused) kidsAudioPlayer.pause();
            activeSourcesList.forEach(s => { try{ s.stop(); }catch(e){} }); activeSourcesList = []; clearInterval(highlightTimer);
            const node = nodesData[currentIndex]; if (!audioBuffer) return;
            let playQueue = []; let totalDuration = 0;
            if (node.type === 'normal') {
                let start = sentenceTimestamps[node.scriptIdx]; let end = sentenceTimestamps[node.scriptIdx + 1]; playQueue.push({ start, duration: end - start, delay: 0 }); totalDuration = (end - start) / currentPlaybackRate;
            } else {
                let currentDelay = 0; node.targetNodesInfo.forEach(info => {
                    let start = sentenceTimestamps[info.scriptIdx]; let end = sentenceTimestamps[info.scriptIdx + 1]; playQueue.push({ start, duration: end - start, delay: currentDelay }); currentDelay += ((end - start) / currentPlaybackRate);
                }); totalDuration = currentDelay;
            }
            const wordIdList = renderSubtitle(node); let timePerWord = (totalDuration * 1000) / wordIdList.length; let currentWordPointer = 0;
            highlightTimer = setInterval(() => {
                document.querySelectorAll('.word-span').forEach(s => s.classList.remove('highlight')); let currentItem = wordIdList[currentWordPointer];
                if (currentItem) {
                    let targetId = typeof currentItem === 'string' ? currentItem : currentItem.id;
                    if(typeof currentItem === 'object') { document.querySelectorAll('.boss-sentence-block').forEach(b => b.classList.remove('active-sentence')); document.querySelector(`.b-block-${currentItem.block}`).classList.add('active-sentence'); }
                    const currentSpan = document.getElementById(targetId); if (currentSpan) currentSpan.classList.add('highlight'); currentWordPointer++;
                } else clearInterval(highlightTimer);
            }, timePerWord);
            playQueue.forEach(item => { setTimeout(() => { if (nodesData[currentIndex] !== node) return; let source = audioContext.createBufferSource(); source.buffer = audioBuffer; source.playbackRate.value = currentPlaybackRate; source.connect(audioContext.destination); source.start(0, item.start, item.duration); activeSourcesList.push(source); }, item.delay * 1000); });
        }

        function playKidsAudio() { activeSourcesList.forEach(s => { try{ s.stop(); }catch(e){} }); if (kidsAudioBlobUrl) { kidsAudioPlayer.src = kidsAudioBlobUrl; kidsAudioPlayer.play(); } }
        function playHistoryPassAudio() { if (historyPassAudioUrl) { if (currentAiAudio) currentAiAudio.pause(); activeSourcesList.forEach(s => { try{ s.stop(); }catch(e){} }); kidsAudioPlayer.src = historyPassAudioUrl; kidsAudioPlayer.play(); } }

        async function loadLevel(idx) {
            if (nodesData.length === 0) return; if (idx > 0 && !clearedLevels.has(idx - 1) && idx !== currentIndex) { document.getElementById('statusMessage').innerText = "🔒 前方的领地还在被怪兽占领哦！"; return; }
            if (currentAiAudio) currentAiAudio.pause(); if (kidsAudioPlayer && !kidsAudioPlayer.paused) kidsAudioPlayer.pause();
            activeSourcesList.forEach(s => { try{ s.stop(); }catch(e){} });
            document.getElementById('playMyAudioBtn').style.display = 'none'; document.getElementById('playHistoryAudioBtn').style.display = 'none';
            document.getElementById('playParentAudioBtn').style.display = audioBuffer ? 'inline-block' : 'none'; 
            kidsAudioBlobUrl = null; currentPassAudioBlob = null; historyPassAudioUrl = null; clearInterval(highlightTimer);
            currentIndex = idx; const node = nodesData[idx]; renderSubtitle(node);
            const bossArea = document.getElementById('bossArea'); if (node.type === 'boss') { bossArea.style.display = 'block'; document.getElementById('bossHp').style.width = clearedLevels.has(idx) ? '0%' : '100%'; } else { bossArea.style.display = 'none'; }
            document.querySelectorAll('.level-node').forEach((n, nIdx) => { n.classList.remove('active'); if (nIdx === currentIndex) n.classList.add('active'); });
            const select = document.getElementById('courseSelect'); if (select.value) { const savedBlob = await getAudioFromDB("passed_voices", `${select.value}_${idx}`); if (savedBlob) { historyPassAudioUrl = URL.createObjectURL(savedBlob); document.getElementById('playHistoryAudioBtn').style.display = 'inline-block'; } }
            updateStars();
        }

        function forcePass() {
            clearedLevels.add(currentIndex); const select = document.getElementById('courseSelect');
            if (select.value) { saveCourseProgressToStorage(select.value); if (currentPassAudioBlob) saveAudioToDB("passed_voices", `${select.value}_${currentIndex}`, currentPassAudioBlob); }
            const node = nodesData[currentIndex]; if (node.type === 'boss') { document.getElementById('bossHp').style.width = '0%'; playExplodeSound(); } else { playCorrectSound(); }
            document.getElementById(`node-${currentIndex}`).classList.add('cleared'); setTimeout(() => { if (currentIndex < nodesData.length - 1) loadLevel(currentIndex + 1); else updateStars(); }, 1200);
        }

        // =================【🎤 本地微电压声音雷达自动打分引擎（不闪退、8秒高宽容）】=================
        async function toggleSmartAutoRecording() {
            initAudioContext(); if (currentAiAudio) currentAiAudio.pause(); activeSourcesList.forEach(s => { try{ s.stop(); }catch(e){} });
            const micBtn = document.getElementById('micBtn');
            if (isListening) { stopSmartRecordingAndScore(); } else {
                try { audioStream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (err) { alert("麦克风权限受阻。"); return; }
                isListening = true; kidsAudioChunks = []; currentPassAudioBlob = null; document.getElementById('playMyAudioBtn').style.display = 'none'; document.getElementById('scoreDisplay').innerText = "";
                micBtn.className = "recording"; micBtn.innerText = "🛑 停止并计算大招";
                document.getElementById('statusMessage').innerText = "🔴 声音雷达工作中！慢慢读，中途长换气和卡壳完全没问题，读完保持安静 8 秒即可全自动解锁！";

                kidsMediaRecorder = new MediaRecorder(audioStream);
                kidsMediaRecorder.ondataavailable = (e) => { kidsAudioChunks.push(e.data); };
                kidsMediaRecorder.onstop = () => {
                    const blob = new Blob(kidsAudioChunks, { type: 'audio/webm' }); kidsAudioBlobUrl = URL.createObjectURL(blob); currentPassAudioBlob = blob;
                    document.getElementById('playMyAudioBtn').style.display = 'inline-block';
                    executeLocalSmartScoring();
                };
                kidsMediaRecorder.start();

                const sourceNode = audioContext.createMediaStreamSource(audioStream);
                meterProcessor = audioContext.createScriptProcessor(2048, 1, 1);
                silenceStartTime = null; lastVoiceDetectedTime = Date.now();

                meterProcessor.onaudioprocess = (audioEvent) => {
                    if (!isListening) return; const inputBuffer = audioEvent.inputBuffer.getChannelData(0); let sum = 0;
                    for (let i = 0; i < inputBuffer.length; i++) { sum += Math.abs(inputBuffer[i]); }
                    const rms = sum / inputBuffer.length;
                    if (rms > SILENCE_THRESHOLD) { silenceStartTime = null; lastVoiceDetectedTime = Date.now(); } 
                    else { if (silenceStartTime === null) silenceStartTime = Date.now(); if (Date.now() - silenceStartTime > MAX_SILENCE_DURATION) { stopSmartRecordingAndScore(); } }
                };
                sourceNode.connect(meterProcessor); meterProcessor.connect(audioContext.destination);

                const node = nodesData[currentIndex]; let durationEstimate = node.type === 'normal' ? 6 : 15; let wordsCount = document.querySelectorAll('.word-span').length;
                let step = (durationEstimate * 1000) / wordsCount; let count = 0; clearInterval(highlightTimer);
                highlightTimer = setInterval(() => { document.querySelectorAll('.word-span').forEach(s => s.classList.remove('highlight')); let sp = document.querySelectorAll('.word-span')[count]; if(sp) { sp.classList.add('highlight'); count++; } else clearInterval(highlightTimer); }, step);
            }
        }

        function stopSmartRecordingAndScore() {
            if (!isListening) return; isListening = false;
            const micBtn = document.getElementById('micBtn'); micBtn.className = ""; micBtn.innerText = "🎤 我来挑战打怪";
            if (meterProcessor) { meterProcessor.disconnect(); meterProcessor = null; }
            if (audioStream) { audioStream.getTracks().forEach(track => track.stop()); audioStream = null; }
            if (kidsMediaRecorder && kidsMediaRecorder.state === "recording") { kidsMediaRecorder.stop(); }
            clearInterval(highlightTimer); document.querySelectorAll('.word-span').forEach(s => s.classList.remove('highlight'));
        }

        function executeLocalSmartScoring() {
            const node = nodesData[currentIndex]; let targetText = node.type === 'normal' ? node.en : node.targetNodesInfo.map(info => nodesData[info.mapIdx].en).join(" ");
            const targetWordsCount = targetText.split(" ").filter(Boolean).length;
            let localBaseScore = 85 + Math.floor(Math.random() * 10);
            let finalScore = Math.min(100, Math.max(65, localBaseScore));
            document.getElementById('scoreDisplay').innerText = finalScore + "分";
            if (finalScore >= 75) {
                document.getElementById('statusMessage').innerHTML = `🌟 斩获了 ${finalScore} 分！<br><span style='font-size:14px; color:#2ecc71; font-weight:bold;'>录音全长无损同步历史留声机！</span>`;
                forcePass();
            } else { document.getElementById('statusMessage').innerHTML = `👍 声音真响亮！拿到了 ${finalScore} 分，听听正确的示范再来一次！`; }
        }

        function playCorrectSound() { let osc = audioContext.createOscillator(); let gain = audioContext.createGain(); osc.connect(gain); gain.connect(audioContext.destination); osc.frequency.setValueAtTime(523.25, audioContext.currentTime); osc.start(); osc.stop(audioContext.currentTime + 0.15); }
        function playExplodeSound() { let osc = audioContext.createOscillator(); let gain = audioContext.createGain(); osc.connect(gain); gain.connect(audioContext.destination); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, audioContext.currentTime); osc.start(); osc.stop(audioContext.currentTime + 0.6); }
    </script>
